[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xtft"
version = "0.1.0.dev0"
description = "Covariate-aware probabilistic forecasting with calibrated, shift-robust uncertainty (PyTorch and TensorFlow backends)"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "earthai-tech", email = "etanoyau@gmail.com" }]
requires-python = ">=3.10"
keywords = [
  "forecasting",
  "probabilistic forecasting",
  "time series",
  "temporal fusion transformer",
  "conformal prediction",
  "deep learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.26,<2.3",
  "pandas>=2.2",
  "scipy>=1.13,<2.0",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "matplotlib>=3.6",
  "joblib>=1.3",
  "tqdm>=4.65",
  "PyYAML>=6.0",
  "packaging>=23",
  "psutil>=5.9",
]

[project.optional-dependencies]
# torch<=2.5 keeps manylinux2014 wheels for glibc-2.17 clusters.
torch = ["torch>=2.1"]
tf = ["tensorflow>=2.20,<3.0"]
bench = [
  "neuralforecast>=1.7",
  "statsforecast>=1.7",
  "datasetsforecast>=1.0",
  "lightgbm>=4.0",
  "xgboost>=2.0",
]
dev = ["pytest>=8", "ruff>=0.5"]
test = ["pytest>=8", "pytest-cov>=5"]
docs = [
  "sphinx>=7",
  "pydata-sphinx-theme>=0.15",
  "numpydoc>=1.6",
  "sphinx-design>=0.5",
  "sphinx-copybutton>=0.5",
  "sphinx-gallery>=0.15",
]

[project.urls]
Homepage = "https://github.com/earthai-tech/xtft"
Documentation = "https://xtft.readthedocs.io"
Source = "https://github.com/earthai-tech/xtft"
Issues = "https://github.com/earthai-tech/xtft/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xtft = ["_log.yml"]

[tool.pytest.ini_options]
# Doctests run for the rewritten modules; ported code joins this
# list once its docstring examples are made runnable.
testpaths = [
  "tests",
  "src/xtft/__init__.py",
  "src/xtft/backends/__init__.py",
  "src/xtft/backends/_framework.py",
  "src/xtft/compat/torch.py",
  "src/xtft/nn/__init__.py",
  "src/xtft/nn/torch",
  "src/xtft/evaluation",
  "src/xtft/data",
]
addopts = "-ra --doctest-modules --ignore=reference"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["xtft"]
branch = true
# Code ported verbatim from fusionlab-learn (Keras backend and
# legacy utilities) is measured once it is rewritten and tested.
omit = [
  "*/xtft/nn/tf/*",
  "*/xtft/api/*",
  "*/xtft/core/*",
  "*/xtft/utils/*",
  "*/xtft/metrics/*",
  "*/xtft/backends/array/*",
  "*/xtft/compat/_config.py",
  "*/xtft/compat/__init__.py",
  "*/xtft/compat/keras*.py",
  "*/xtft/compat/kt.py",
  "*/xtft/compat/numpy.py",
  "*/xtft/compat/pandas.py",
  "*/xtft/compat/scipy.py",
  "*/xtft/compat/sklearn.py",
  "*/xtft/compat/tf.py",
  "*/xtft/compat/types.py",
  "*/xtft/_configs.py",
  "*/xtft/_deps.py",
  "*/xtft/_dummies.py",
  "*/xtft/_log.py",
  "*/xtft/_optdeps.py",
  "*/xtft/_util.py",
  "*/xtft/decorators.py",
  "*/xtft/exceptions.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 71
target-version = "py310"
src = ["src"]
# Code ported verbatim from fusionlab-learn is linted when it is
# rewritten; new code is held to the 71-character standard now.
extend-exclude = [
  "reference",
  "src/xtft/_configs.py",
  "src/xtft/_deps.py",
  "src/xtft/_dummies.py",
  "src/xtft/_log.py",
  "src/xtft/_optdeps.py",
  "src/xtft/_util.py",
  "src/xtft/decorators.py",
  "src/xtft/exceptions.py",
  "src/xtft/api",
  "src/xtft/backends/array",
  "src/xtft/compat/_config.py",
  "src/xtft/compat/__init__.py",
  "src/xtft/compat/keras*.py",
  "src/xtft/compat/kt.py",
  "src/xtft/compat/numpy.py",
  "src/xtft/compat/pandas.py",
  "src/xtft/compat/scipy.py",
  "src/xtft/compat/sklearn.py",
  "src/xtft/compat/tf.py",
  "src/xtft/compat/types.py",
  "src/xtft/core",
  "src/xtft/metrics",
  "src/xtft/utils",
  "src/xtft/nn/tf/components",
  "src/xtft/nn/tf/hybrid/_*.py",
  "src/xtft/nn/tf/hybrid/utils.py",
  "src/xtft/nn/tf/transformers/_*.py",
  "src/xtft/nn/tf/_*.py",
  "src/xtft/nn/tf/[a-z]*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]
"tools/*" = ["D103"]
"tools/make_logo.py" = ["D103", "E501"]  # SVG markup
"benchmarks/*" = ["D103"]
# Sphinx-Gallery titles: a title line underlined, no period.
"examples/*" = ["D205", "D400"]

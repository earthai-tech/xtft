# Read the Docs configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # CPU PyTorch only (the CUDA wheels are large and unused). Its
    # dependencies come from PyPI in the install step: the copies on
    # the PyTorch index have broken metadata for some pip versions.
    pre_install:
      - pip install "torch>=2.1" --no-deps --index-url https://download.pytorch.org/whl/cpu

sphinx:
  configuration: docs/conf.py
  # A broken reference or directive fails the build instead of
  # publishing a page with a hole in it.
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - torch
        - docs

formats:
  - htmlzip

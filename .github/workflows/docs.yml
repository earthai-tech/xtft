name: Docs

on:
  push:
    branches: [master, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install xtft and Sphinx
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.1" \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[torch,docs]"

      - name: Build HTML (warnings are errors)
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # Publish on pushes to master and on version tags. GitHub Pages
    # must be enabled (Settings > Pages > Source: GitHub Actions).
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

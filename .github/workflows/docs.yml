name: Docs

on:
  push:
    branches: [master, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The site is published by Read the Docs (.readthedocs.yaml); this
# workflow only checks that the pages build.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install xtft and Sphinx
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.1" \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[torch,docs]"

      # The gallery runs on Read the Docs; here the pages are
      # checked without executing the examples.
      - name: Build HTML (warnings are errors)
        env:
          XTFT_DOCS_NO_EXAMPLES: "1"
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

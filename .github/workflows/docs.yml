name: Docs

# Build the documentation on every push to master, the main branch.
# The pages must build with warnings as errors and the example
# gallery is executed, as on Read the Docs, which builds and hosts
# the site from .readthedocs.yaml. A second job then asks Read the
# Docs to rebuild "latest", for projects whose webhook is not set
# up (private repositories): add the secret READTHEDOCS_TOKEN
# (readthedocs.org > Account settings > API tokens) to enable it.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the documentation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install xtft and Sphinx
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.1" \
            --no-deps --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[torch,docs]"

      - name: Build HTML (warnings are errors)
        env:
          MPLBACKEND: Agg
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Upload the site
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7

  readthedocs:
    name: Trigger Read the Docs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request a build of "latest"
        env:
          TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "READTHEDOCS_TOKEN not set: Read the Docs builds" \
              "from its webhook."
            exit 0
          fi
          code=$(curl -s -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Token $TOKEN" \
            "https://readthedocs.org/api/v3/projects/xtft/versions/latest/builds/")
          cat response.json; echo
          if [ "$code" -ge 300 ]; then
            echo "::warning::Read the Docs answered HTTP $code."
          fi

name: Release

# Runs when a version tag is pushed, and only then:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the version in pyproject.toml. The package is
# built, tested as an installed wheel and uploaded to TestPyPI;
# a final version (v1.2.0) then goes to PyPI, a pre-release
# (v1.2.0rc1, a1, b1, .dev1) stays on TestPyPI. A GitHub release
# with the files follows.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   PYPI_API_TOKEN       API token of pypi.org (scope: project xtft,
#                        or the whole account for the first upload)
#   TEST_PYPI_API_TOKEN  API token of test.pypi.org

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read and check the version
        id: version
        shell: bash
        run: |
          python -m pip install --upgrade pip packaging
          version=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )
          pre=$(python -c "from packaging.version import Version as V; v=V('$version'); print(str(v.is_prerelease or v.is_devrelease).lower())")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          tag="${GITHUB_REF_NAME#v}"
          same=$(python -c "from packaging.version import Version as V; print(V('$tag') == V('$version'))")
          if [ "$same" != "True" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
          echo "Version $version (pre-release: $pre)"

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Install the wheel and run the tests against it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install "torch>=2.1" \
            --index-url https://download.pytorch.org/whl/cpu
          /tmp/wheel-env/bin/pip install "$(ls dist/*.whl)[torch,test]"
          # Run from a copy of the tests so that the installed wheel,
          # not the checkout, is imported.
          cp -r tests /tmp/wheel-tests
          cd /tmp && /tmp/wheel-env/bin/python -m pytest -q \
            -p no:cacheprovider wheel-tests
          /tmp/wheel-env/bin/python -c \
            "import xtft; print('xtft', xtft.__version__)"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/xtft/
    steps:
      - name: Check the token
        env:
          TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret TEST_PYPI_API_TOKEN is not set."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          # A version can be uploaded once; re-runs skip it.
          skip-existing: true
          attestations: false

  pypi:
    name: Publish to PyPI
    # Only after the upload to TestPyPI succeeded, and only for
    # final versions.
    needs: [build, testpypi]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xtft/
    steps:
      - name: Check the token
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret PYPI_API_TOKEN is not set."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false

  github-release:
    name: GitHub release
    needs: [build, testpypi, pypi]
    # After TestPyPI, and after PyPI for a final version.
    if: >
      always() && needs.testpypi.result == 'success' &&
      (needs.pypi.result == 'success' ||
       needs.build.outputs.prerelease == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}

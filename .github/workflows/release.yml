name: Release

# Push a tag "vX.Y.Z" whose version matches pyproject.toml:
#   final versions (1.2.0)            -> PyPI + GitHub release
#   pre-releases (1.2.0rc1, a1, b1,
#   1.2.0.dev1)                       -> TestPyPI + GitHub pre-release
# Manual runs publish the current commit to TestPyPI.
#
# Publishing uses PyPI trusted publishing (OIDC, no API token):
# add this repository as a trusted publisher on pypi.org and
# test.pypi.org (workflow "release.yml", environments "pypi" and
# "testpypi").

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read and check the version
        id: version
        shell: bash
        run: |
          python -m pip install --upgrade pip packaging
          version=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )
          pre=$(python -c "from packaging.version import Version as V; v=V('$version'); print(str(v.is_prerelease or v.is_devrelease).lower())")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            same=$(python -c "from packaging.version import Version as V; print(V('$tag') == V('$version'))")
            if [ "$same" != "True" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
              exit 1
            fi
          fi
          echo "Version $version (pre-release: $pre)"

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python -c "import xtft, xtft.evaluation, xtft.data; print(xtft.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.build.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/xtft
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: build
    if: >
      github.ref_type == 'tag' &&
      needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xtft
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: [build, pypi, testpypi]
    # Runs after whichever publish job applied to this tag.
    if: >
      always() && github.ref_type == 'tag' &&
      needs.build.result == 'success' &&
      (needs.pypi.result == 'success' ||
       needs.testpypi.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}

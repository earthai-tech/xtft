<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="XTFT">
  <!-- quantile fan: outer band and inner interval -->
  <path d="M128 128 L222 52 L222 204 Z" fill="#12a58a"
        fill-opacity="0.22"/>
  <path d="M128 128 L222 84 L222 172 Z" fill="#12a58a"
        fill-opacity="0.6"/>
  <path d="M128 128 L222 128" stroke="#14203a" stroke-width="9"
        stroke-linecap="round"/>
  <!-- inputs: observed series, known covariate, static -->
  <path d="M34 52 L128 128" stroke="#0277bd" stroke-width="13"
        stroke-linecap="round"/>
  <path d="M34 128 L128 128" stroke="#7e57c2" stroke-width="13"
        stroke-linecap="round" stroke-dasharray="1 20"/>
  <path d="M34 204 L128 128" stroke="#f29d0c" stroke-width="13"
        stroke-linecap="round"/>
  <!-- forecast origin -->
  <circle cx="128" cy="128" r="13" fill="#14203a"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" role="img" aria-labelledby="t d">
  <title id="t">XTFT</title>
  <desc id="d">XTFT: covariate-aware probabilistic forecasting with calibrated, shift-robust uncertainty</desc>
  <!-- Generated by tools/make_logo.py. Symbol: history (with a
       gap), a known covariate and a static attribute meet at the
       forecast origin; a quantile fan opens inside a whole-path
       band. -->
  <g transform="translate(14 14) scale(0.75)">
  <!-- forecast origin -->
  <line x1="136" y1="40" x2="136" y2="216" stroke="#ffffff"
        stroke-opacity="0.3" stroke-width="2" stroke-dasharray="5 6"/>
  <!-- whole-path band (outlined) and per-step fan -->
  <path d="M136 128 C164 112 196 78 226 58 L226 198
           C196 178 164 144 136 128 Z" fill="#e8f5e9"
        fill-opacity="0.08" stroke="#e8f5e9" stroke-opacity="0.7"
        stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M136 128 C166 118 196 100 226 90 L226 164
           C196 154 166 138 136 128 Z" fill="#26c6a6"
        fill-opacity="0.8"/>
  <path d="M136 128 C166 126 196 132 226 124" fill="none"
        stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- observed history with a gap -->
  <polyline points="30.0,92.0 33.4,97.3 36.8,99.9 40.2,98.8 43.6,94.7 47.0,89.9 50.4,87.2 53.8,88.0 57.2,91.9 60.6,96.7 64.0,99.8 67.4,99.2" fill="none" stroke="#4fc3f7"
            stroke-width="4.5" stroke-linejoin="round"
            stroke-linecap="round"/>
  <polyline points="84.4,86.7 87.8,91.5 91.2,95.7 94.6,97.0 98.0,94.6 101.4,90.0 104.8,85.6 108.2,84.0 111.6,86.2 115.0,91.2 118.4,96.7" fill="none" stroke="#4fc3f7"
            stroke-width="4.5" stroke-linejoin="round"
            stroke-linecap="round"/>
  <!-- covariate known in advance: continues past the origin -->
  <path d="M30 166 C52 156 72 176 96 164 S126 158 136 162
           S190 150 226 142" fill="none" stroke="#b39ddb"
        stroke-width="4" stroke-linecap="round" stroke-dasharray="1 8"/>
  <!-- static attribute -->
  <rect x="30" y="192" width="54" height="10" rx="5"
        fill="#ffb74d"/>
  <!-- fusion at the origin -->
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"
     stroke-linecap="round">
    <line x1="118.4" y1="96.7" x2="136" y2="128"/>
    <line x1="96" y1="164" x2="136" y2="128"/>
    <line x1="84" y1="197" x2="136" y2="128"/>
  </g>
  <circle cx="118.4" cy="96.7" r="4.5" fill="#4fc3f7"/>
  <circle cx="96" cy="164" r="4.5" fill="#b39ddb"/>
  <circle cx="84" cy="197" r="4.5" fill="#ffb74d"/>
  <circle cx="136" cy="128" r="7.5" fill="#ffffff"/>
  </g>
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="236" y="118" font-size="104" font-weight="700" letter-spacing="6" fill="#e6e9f2"><tspan fill="#ffb74d">X</tspan>TFT</text>
    <rect x="240" y="138" width="92" height="6" rx="3" fill="#26c6a6"/>
    <text x="240" y="178" font-size="25" font-weight="600" fill="#e6e9f2">Covariate-aware probabilistic forecasting</text>
    <text x="240" y="208" font-size="19" fill="#9aa3b8">calibrated, shift-robust uncertainty for whole forecast paths</text>
  </g>
</svg>

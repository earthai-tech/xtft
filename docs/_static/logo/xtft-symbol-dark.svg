<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="XTFT">
  <!-- quantile fan: outer band and inner interval -->
  <path d="M128 128 L222 52 L222 204 Z" fill="#2fd3b2"
        fill-opacity="0.4"/>
  <path d="M128 128 L222 84 L222 172 Z" fill="#2fd3b2"
        fill-opacity="0.6"/>
  <path d="M128 128 L222 128" stroke="#e6e9f2" stroke-width="9"
        stroke-linecap="round"/>
  <!-- inputs: observed series, known covariate, static -->
  <path d="M34 52 L128 128" stroke="#4fc3f7" stroke-width="13"
        stroke-linecap="round"/>
  <path d="M34 128 L128 128" stroke="#b39ddb" stroke-width="13"
        stroke-linecap="round" stroke-dasharray="1 20"/>
  <path d="M34 204 L128 128" stroke="#ffb74d" stroke-width="13"
        stroke-linecap="round"/>
  <!-- forecast origin -->
  <circle cx="128" cy="128" r="13" fill="#e6e9f2"/>
</svg>
